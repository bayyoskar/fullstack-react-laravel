[build]
builder = "nixpacks"

[phases.setup]
nixPkgs = ["php", "php83Extensions.mbstring", "php83Extensions.pdo_mysql", "php83Extensions.tokenizer", "curl"]

[phases.build]
cmds = [
  "cd ubur_ubur && curl -sS https://getcomposer.org/installer | php -- --install-dir=/tmp",
  "cd ubur_ubur && php /tmp/composer.phar install --no-dev --optimize-autoloader",
  "cd ubur_ubur && php artisan key:generate"
]

[start]
cmd = "cd ubur_ubur && php artisan serve --host=0.0.0.0 --port=8000"