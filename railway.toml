[build]
builder = "nixpacks"
buildCommand = """
apt-get update && apt-get install -y php php-cli php-mbstring unzip curl
curl -sS https://getcomposer.org/installer | php
mv composer.phar /usr/local/bin/composer
cd ubur_ubur && composer install --no-dev --optimize-autoloader && php artisan key:generate
"""

[start]
startCommand = "cd ubur_ubur && php artisan serve --host=0.0.0.0 --port=8000"