[build]
builder = "nixpacks"
buildCommand = "apt-get update && apt-get install -y php-cli php-mbstring unzip curl && curl -sS https://getcomposer.org/installer | php && mv composer.phar /usr/bin/composer && cd ubur_ubur && /usr/bin/php /usr/bin/composer install && php artisan key:generate"
startCommand = "cd ubur_ubur && php artisan serve --host=0.0.0.0 --port=8000"